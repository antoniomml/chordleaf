# Explicit lifecycle-script policy for installed dependencies.
allowBuilds:
  esbuild: true
  core-js: false
  electron-winstaller: false
  onnxruntime-node: false
  protobufjs: false

# Use Electron's Fetch-based downloader instead of the vulnerable legacy cache
# chain (GHSA-ch52-4w7c-c8xp). Requires the project's Node.js 24 environment.
overrides:
  "app-builder-lib@26.15.3>@electron/get": 5.1.0
  # argparse 2 retains the legacy aliases used by Mammoth's CLI and removes
  # its vulnerable sprintf-js dependency (GHSA-hp3w-g68c-fv3c).
  "mammoth@1.13.0>argparse": 2.0.1
