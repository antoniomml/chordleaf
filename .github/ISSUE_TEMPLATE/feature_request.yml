name: An idea for chordi
description: Suggest something that helps you write, rehearse or play.
body:
  - type: textarea
    id: need
    attributes:
      label: What would you like to achieve?
      description: Explain when it would help and how you do it today.
    validations:
      required: true
  - type: textarea
    id: idea
    attributes:
      label: How do you imagine the improvement?
      description: You can include a sketch or an invented example.
