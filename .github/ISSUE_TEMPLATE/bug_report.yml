name: Something is not working
description: Tell us what happened while preparing your song.
body:
  - type: textarea
    id: problem
    attributes:
      label: What were you trying to do, and what happened?
      description: Include the result you expected.
    validations:
      required: true
  - type: textarea
    id: steps
    attributes:
      label: Steps to reproduce
      description: If needed, use a short invented example with the affected chords. Avoid personal documents or complete third-party lyrics.
    validations:
      required: true
  - type: input
    id: environment
    attributes:
      label: Browser and device
      placeholder: For example, Firefox on Windows or Safari on iPhone.
