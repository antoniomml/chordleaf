version: 2
updates:
  - package-ecosystem: npm
    directory: /
    schedule:
      interval: weekly
    open-pull-requests-limit: 5
  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: weekly
  - package-ecosystem: pip
    directory: /experiments/audio
    schedule:
      interval: weekly
    open-pull-requests-limit: 5
    groups:
      python-audio:
        patterns:
          - "*"
