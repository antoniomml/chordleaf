name: Desktop candidate
on:
  pull_request:
    paths:
      - "desktop/**"
      - "scripts/desktop/**"
      - "experiments/audio/**"
      - "server/**"
      - "src/**"
      - "package.json"
      - "pnpm-lock.yaml"
      - ".github/workflows/desktop.yml"
  workflow_dispatch:
    inputs:
      signed:
        description: Sign and notarize with the configured Developer ID
        type: boolean
        default: false
permissions:
  contents: read
concurrency:
  group: desktop-${{ github.ref }}
  cancel-in-progress: false
jobs:
  mac:
    runs-on: macos-15
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
      - uses: pnpm/action-setup@ea17c68df8912ef543352723c149a84f56e3d413
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020
        with:
          node-version: 24
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: node node_modules/electron/install.js
      - run: pnpm check
      - run: pnpm desktop:runtime
      - run: pnpm test:desktop
      - name: Prepare notarization key
        if: inputs.signed
        env:
          APPLE_API_KEY_BASE64: ${{ secrets.APPLE_API_KEY_BASE64 }}
        run: |
          python3 - <<'PY'
          import os, base64, pathlib
          data = os.environ['APPLE_API_KEY_BASE64']
          if not data: raise SystemExit('Configure Apple notarization credentials first')
          target = pathlib.Path(os.environ['RUNNER_TEMP']) / 'chordleaf-notary.p8'
          target.write_bytes(base64.b64decode(data))
          target.chmod(0o600)
          PY
      - name: Build candidate
        if: ${{ !inputs.signed }}
        run: |
          pnpm desktop:dist
          node scripts/desktop/test-packaged-smoke.mjs
      - name: Build signed installer
        if: inputs.signed
        env:
          CHORDLEAF_SIGNED_RELEASE: "1"
          CSC_NAME: ${{ secrets.CSC_NAME }}
          CSC_LINK: ${{ secrets.CSC_LINK }}
          CSC_KEY_PASSWORD: ${{ secrets.CSC_KEY_PASSWORD }}
          APPLE_API_KEY: ${{ runner.temp }}/chordleaf-notary.p8
          APPLE_API_KEY_ID: ${{ secrets.APPLE_API_KEY_ID }}
          APPLE_API_ISSUER: ${{ secrets.APPLE_API_ISSUER }}
        run: |
          pnpm desktop:dist
          node scripts/desktop/verify-release.mjs
      - name: Remove temporary notarization key
        if: always()
        run: rm -f "$RUNNER_TEMP/chordleaf-notary.p8"
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: chordleaf-mac-arm64-${{ inputs.signed && 'signed' || 'unsigned-candidate' }}
          path: |
            release-desktop/*.dmg
            release-desktop/SHA256SUMS.txt
          retention-days: 7
