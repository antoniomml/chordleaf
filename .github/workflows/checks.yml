name: Checks
on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: checks-${{ github.ref }}
  cancel-in-progress: true
jobs:
  app:
    # Keep dependency setup and the complete browser matrix within the job budget.
    timeout-minutes: 30
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: pnpm/action-setup@ea17c68df8912ef543352723c149a84f56e3d413 # v6.1.0
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: 24
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm check
      - run: pnpm audit --audit-level=high
      - name: Audit pinned Python audio dependencies
        timeout-minutes: 10
        run: |
          python3 -m venv /tmp/chordleaf-pip-audit
          /tmp/chordleaf-pip-audit/bin/pip install pip-audit==2.10.1
          for manifest in requirements-desktop.lock.txt requirements-neural.lock.txt requirements-browser-export.txt; do
            /tmp/chordleaf-pip-audit/bin/pip-audit --no-deps --disable-pip --progress-spinner off -r "experiments/audio/$manifest"
          done
      - name: Playwright version
        id: playwright-version
        run: echo "version=$(pnpm exec playwright --version | cut -d' ' -f2)" >> "$GITHUB_OUTPUT"
      - uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: ~/.cache/ms-playwright
          key: playwright-${{ runner.os }}-${{ steps.playwright-version.outputs.version }}
      - name: Use the official Ubuntu package mirror
        # Ubuntu runners use mirror+file, so replacing only the Azure URL in
        # ubuntu.sources leaves APT downloading from the same slow mirror.
        run: |
          sudo sed -i \
            -e 's|mirror+file:/etc/apt/apt-mirrors.txt|https://archive.ubuntu.com/ubuntu/|g' \
            -e 's|mirror+file:/etc/apt/apt-security-mirrors.txt|https://security.ubuntu.com/ubuntu/|g' \
            -e 's|http://azure\.archive\.ubuntu\.com/ubuntu|https://archive.ubuntu.com/ubuntu|g' \
            /etc/apt/sources.list.d/ubuntu.sources
      - name: Install browser dependencies
        timeout-minutes: 15
        run: pnpm exec playwright install --with-deps chromium firefox webkit
      - name: Browser tests
        run: |
          mkdir -p artifacts
          PORT=5173 pnpm start > /tmp/chordleaf-server.log 2>&1 &
          server_pid=$!
          trap 'kill "$server_pid"' EXIT
          for attempt in {1..30}; do
            if curl --silent --fail http://localhost:5173 > /dev/null; then break; fi
            sleep 1
          done
          curl --silent --fail http://localhost:5173 > /dev/null
          pnpm test:e2e
          pnpm test:compatibility
      - name: Upload browser artifacts
        if: failure()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v4.6.0
        with:
          name: browser-artifacts
          path: |
            artifacts/
            /tmp/chordleaf-server.log
          if-no-files-found: ignore
          retention-days: 7
